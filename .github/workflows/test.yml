name: tests

# Runs the pure-Python unit suite (parsers, verdict logic, NO_CALL coverage gate,
# and the single-source genes.tsv regression). No Docker image or sample data
# needed — these import the scripts directly and run in seconds.

on:
  push:
    paths:
      - 'docker/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'docker/**'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile check
        run: python3 -m py_compile docker/pgx-compare.py docker/pgx-report.py
      - name: genes.tsv regression
        run: python3 docker/test_genes_config.py
      - name: Output parsers
        run: python3 docker/test_parsers.py
      - name: Verdict authority
        run: python3 docker/test_verdict.py
      - name: NO_CALL coverage gate
        run: python3 docker/test_coverage_gate.py
      - name: CPIC data file + registry
        run: python3 docker/test_cpic.py
      - name: Variant-tier reconciliation
        run: python3 docker/test_reconcile.py
      - name: RYR1 VCF-Check variant table
        run: python3 docker/test_vcf_check.py
      - name: Cyrius CYP2D6 integration
        run: python3 docker/test_cyrius.py
